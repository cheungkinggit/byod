ex-wrap:wrap;font-size:.82rem;margin:8px 0 15px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#123d50;color:#fff;padding:10px 14px;border-radius:10px;display:none;max-width:90%;z-index:10}.hidden{display:none!important}@media(min-width:700px){.shell{padding:22px 25px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two>*{align-self:start}}@media print{@page{size:A4 landscape;margin:8mm}body{background:#fff;color:#111}.no-print,.top,.tabs,#toast{display:none!important}.shell{max-width:none;padding:0}.card,.report{border:0;box-shadow:none;padding:0;margin:0}.report table{font-size:7.5pt}.report th,.report td{padding:3px}.report tr{break-inside:avoid}.report h1{font-size:15pt;margin:0 0 4px}.report-meta{font-size:8pt;margin:4px 0 8px}}

<body><div id="app"><main class="shell"><p>系統載入中（Loading…）</p></main></div><div id="loading" class="hidden" role="status" aria-live="polite">載入中（Loading…）</div><div id="toast" role="status" aria-live="polite"></div><script>
const app=document.querySelector('#app');
const issues=['使用時間過長','不恰當資料（相片／影片）','觀看視頻過多（如 YouTube）','其他問題'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const uid=()=>Math.random().toString(36).slice(2);
let state={admin:false,actions:[]},teacherName='',directory=null,current=null,screen='home',dirMode='students',dirClass='4A',dirTeacher='',drafts=[{id:uid(),label:'',teacherName:'',roster:'',sampleCount:5}],form={title:'BYOD iPad 特擊抽查',date:today(),time:'',grade:'',coordinatorName:''},busy=false;
const classNames=()=>[...new Set((directory?.students||[]).map(s=>s.classLabel))].sort();
const rosterFor=label=>(directory?.students||[]).filter(s=>s.classLabel===label).map(s=>`${s.number} ${s.name}`).join('\n');
function fillClass(d,label){d.label=label;d.roster=rosterFor(label);let index=(directory?.teachers||[]).findIndex(t=>t.defaultClass===label);d.teacherName=index<0?'':directory.teachers[index].name;}
function rosterLines(value){return value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>{let m=x.match(/^(\d{1,3})\s+(.+)$/);return m?{number:m[1],name:m[2]}:{number:'',name:x}})}
const bridgeNonce=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
const bridgeCalls=new Map();
let bridgeWindow=null,bridgeOrigin='',bridgeResolve,bridgeReject;
const bridgeReady=new Promise((resolve,reject)=>{bridgeResolve=resolve;bridgeReject=reject});
bridgeReady.catch(()=>{});
const bridgeTimer=setTimeout(()=>bridgeReject(new Error('連接系統逾時，請重新整理頁面。')),45000);
window.addEventListener('message',event=>{
  const data=event.data;
  if(!data||data.nonce!==bridgeNonce)return;
  let host;
  try{host=new URL(event.origin).hostname}catch{return}
  if(host!=='script.google.com'&&host!=='script.googleusercontent.com'&&!host.endsWith('.googleusercontent.com'))return;
  if(data.type==='BYOD_READY'){
    if(bridgeWindow&&bridgeWindow!==event.source)return;
    bridgeWindow=event.source;bridgeOrigin=event.origin;clearTimeout(bridgeTimer);bridgeResolve();return;
  }
  if(data.type!=='BYOD_RESPONSE'||event.source!==bridgeWindow)return;
  const pending=bridgeCalls.get(data.id);
  if(!pending)return;
  bridgeCalls.delete(data.id);clearTimeout(pending.timer);
  data.ok?pending.resolve(data.value):pending.reject(new Error(String(data.value||'系統操作失敗。')));
});
const bridgeFrame=document.createElement('iframe');
bridgeFrame.src='https://script.google.com/macros/s/AKfycbzwfTjtVa1KhvBHLmSpYCx2YGazh6lIhqcJX8rSvbBq0lyVfjhxXc_caZEdUAJ9Mj1kFw/exec?bridge=1&nonce='+bridgeNonce;
bridgeFrame.title='系統連線';
bridgeFrame.setAttribute('aria-hidden','true');
bridgeFrame.tabIndex=-1;
bridgeFrame.style.cssText='position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none';
document.body.appendChild(bridgeFrame);
const loading=document.querySelector('#loading');
let pendingLoads=0;
function loadingState(start){
  pendingLoads=Math.max(0,pendingLoads+(start?1:-1));
  loading.classList.toggle('hidden',pendingLoads===0);
}
async function rpc(showLoading,fn,...args){
  if(showLoading)loadingState(true);
  try{
    await bridgeReady;
    const values=fn==='login'?args:[sessionStorage.getItem('byodToken')||'',...args];
    return await new Promise((resolve,reject)=>{
      const id='r-'+uid()+'-'+uid();
      const timer=setTimeout(()=>{bridgeCalls.delete(id);reject(new Error('系統操作逾時，請重試。'))},60000);
      bridgeCalls.set(id,{resolve,reject,timer});
      bridgeWindow.postMessage({type:'BYOD_REQUEST',nonce:bridgeNonce,id,method:fn,args:values},bridgeOrigin);
    });
  }finally{
    if(showLoading)loadingState(false);
  }
}
const call=(fn,...args)=>rpc(true,fn,...args);
const callQuiet=(fn,...args)=>rpc(false,fn,...args);
function toast(m){let n=document.querySelector('#toast');n.textContent=m;n.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.display='none',4200)}
function loginPage(message=''){document.body.className='';app.innerHTML='<main class="shell"><header class="hero"><div class="school">藍田循道衞理小學</div><div class="brand">BYOD iPad 抽查系統</div><div class="sub">手機抽查紀錄</div></header><section class="card"><h1>登入系統</h1><form id="loginForm"><label>登入名稱<input name="loginName" autocomplete="username" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">登入</button></form>'+(message?'<p class="small warn">'+esc(message)+'</p>':'')+'</section></main>'}
function chooseTeacherPage(){shell('<h1>選擇負責老師</h1><form id="chooseTeacherForm" class="card"><p class="small muted">共用使用者帳戶登入後，先選自己的姓名；每部手機獨立操作。</p><label>老師姓名<select name="name" required><option value="">請選擇</option>'+state.teacherOptions.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+'</select></label><button class="btn" type="submit">查看我的班別</button></form>')}

function guide(){return `<details class="guide no-print"><summary>BYOD iPad 抽查工作指引（小四至小六）</summary><div class="guide-body"><h3>一、工作理念</h3><p>本校推行 BYOD（Bring Your Own Device），旨在善用科技提升學習效能，培養學生良好的資訊素養與自律精神。iPad 為學習工具而非娛樂用品，本行動以「教育為本、預防為先、輔導為主、懲處為輔」為原則。</p><h3>二、工作目標</h3><ol><li>促進學生正確及自律使用 iPad 作學習用途</li><li>防止過度使用電子產品</li><li>提升網絡安全意識</li><li>及早識別有需要支援的學生</li><li>培養學生的自律精神</li></ol><h3>三、抽查安排</h3><p>對象：小四至小六<br>時間：約 15 分鐘<br>形式：不定時抽樣檢查（通常於 DAY E 週會時段／DAY C 聯課活動時段）<br>每次抽查一級，每班約 5 位學生，每班 1 位老師負責</p><h3>四、負責人</h3><p>統籌：景、彤<br>抽查老師：訓輔組／資訊科技組／班主任老師（每班 1 位老師負責）</p><h3>五、抽查程序</h3><ol><li>隨機抽選學生（見學生名單）</li><li>查驗使用時間、瀏覽紀錄、相簿、應用程式使用情況（YouTube）</li><li>尊重私隱，不公開展示內容</li></ol><h3>六、跟進方法</h3><p>按情況分級處理：口頭提醒、輔導跟進、通知家長。若情況特殊，應商討跟進方法（如轉介社工）。負責老師抽查後，須向統籌人員匯報。</p></div></details>`}
function shell(body){document.body.className=state.admin?'role-admin':'role-teacher';const a=(screen==='detail'||screen==='report'?current?.action:null)||state.actions.find(x=>x.status!=='completed'),progress=a?.progress||{},done=Object.values(progress).filter(x=>x.done).length;app.innerHTML=`<main class="shell"><header class="hero no-print"><div class="hero-top"><div class="hero-left"><div class="school">藍田循道衞理小學</div><div class="brand">BYOD iPad 抽查系統</div><div class="hero-user"><span class="pill">${state.admin?'管理者版面':'使用者版面 · '+esc(teacherName)}</span><button class="btn ghost sm" data-act="logout">登出</button></div></div><div class="hero-event"><strong>${a?esc(a.title):'未有抽查行動'}</strong><span>${a?`${esc(a.date)} ${esc(a.time)} · ${esc(a.grade)}`:'請等候管理員建立行動'}</span><span>${a?`${done}/${a.classes.length} 班完成`:''}</span></div></div></header><nav class="tabs no-print"><button data-act="home" class="${screen==='home'?'sel':''}">${state.admin?'行動進度':'我的班別'}</button>${state.admin?`<button data-act="new" class="${screen==='new'?'sel':''}">新增行動</button><button data-act="directory" class="${screen==='directory'?'sel':''}">名單管理</button>`:''}<button data-act="history" class="${screen==='history'?'sel':''}">歷史紀錄</button></nav>${body}<footer>${guide()}</footer></main>`}
function render(){if(!state.admin&&!teacherName)return chooseTeacherPage();if(screen==='directory'&&state.admin)return directoryPage();if(screen==='new'&&state.admin)return newForm();if(screen==='detail'&&current)return detail();if(screen==='report'&&current)return report();let list=state.actions.filter(a=>screen==='history'?a.status==='completed':a.status!=='completed');shell('<h1>'+(screen==='history'?'歷史紀錄':state.admin?'行動進度':'我的班別')+'</h1>'+(list.length?'<div class="list">'+list.map(a=>{let p=a.progress||{},n=a.classes.length,d=Object.values(p).filter(x=>x.done).length;return '<article class="card"><div class="row between"><div><div class="action-title">'+esc(a.title)+'</div><div class="small muted">'+esc(a.date)+' '+esc(a.time)+' · '+esc(a.grade)+' · '+n+' 班</div></div><span class="pill '+(a.status==='completed'?'done':'')+'">'+(a.status==='completed'?'已完成':'進行中')+'</span></div><div class="progress"><i style="width:'+(n?d/n*100:0)+'%"></i></div><div class="row between"><span class="small">'+d+'/'+n+' 班完成</span><div class="row"><button class="btn secondary sm" data-act="open" data-id="'+esc(a.id)+'">查看</button>'+(state.admin?'<button class="btn danger sm" data-act="deleteAction" data-id="'+esc(a.id)+'">刪除任務</button>':'')+'</div></div></article>'}).join('')+'</div>':'<div class="card empty">暫時未有相關行動</div>'))}

function syncForm(){let f=document.querySelector('#createForm');if(f){for(let k of Object.keys(form))form[k]=f.elements[k]?.value??form[k];document.querySelectorAll('[data-draft]').forEach(el=>{let d=drafts.find(x=>x.id===el.dataset.draft);if(d)el.querySelectorAll('[data-field]').forEach(x=>d[x.dataset.field]=x.value)})}}
function directoryPage(){
  const classes=classNames(),teachers=directory?.teachers||[];
  if(!classes.includes(dirClass))dirClass=classes[0]||'4A';
  if(dirTeacher&&!teachers.some(t=>t.name===dirTeacher))dirTeacher='';
  const selected=teachers.find(t=>t.name===dirTeacher)||{name:'',defaultClass:''};
  const students=dirMode==='students';
  shell(`<h1>名單管理</h1><p class="small muted">更新後供新行動帶入；已建立的行動仍保留原有抽查名單及指派。</p><div class="tabs"><button class="${students?'sel':''}" data-act="dirStudents">學生名單</button><button class="${students?'':'sel'}" data-act="dirTeachers">教師名單</button></div>${students?`<form id="rosterForm" class="card"><div class="row between"><h2>學生名單</h2><span class="pill">${(directory?.students||[]).filter(s=>s.classLabel===dirClass).length} 人</span></div><label>班別<select id="rosterClass">${classes.map(c=>`<option value="${esc(c)}" ${c===dirClass?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>學號及姓名（一行一人）<textarea name="roster" rows="12" required placeholder="01 陳同學&#10;02 李同學">${esc(rosterFor(dirClass))}</textarea></label><p class="small muted">儲存前請核對學號；每班須有 1 至 60 人，學號不得重複。</p><button class="btn" type="submit">儲存 ${esc(dirClass)} 名單</button></form>`:`<form id="teacherForm" class="card"><h2>教師名單</h2><label>選取老師<select id="teacherSelect"><option value="">＋ 新增老師</option>${teachers.map(t=>`<option value="${esc(t.name)}" ${t.name===dirTeacher?'selected':''}>${esc(t.name)}${t.defaultClass?' · '+esc(t.defaultClass):''}</option>`).join('')}</select></label><div class="fieldrow"><label>姓名<input name="name" required value="${esc(selected.name)}"></label><label>預設班別<select name="defaultClass"><option value="">不指定</option>${[1,2,3,4,5,6].flatMap(g=>['A','B','C','D','E'].map(x=>`${g}${x}`)).map(c=>`<option value="${c}" ${selected.defaultClass===c?'selected':''}>${c}</option>`).join('')}</select></label></div><div class="row" style="margin-top:14px"><button class="btn" type="submit">${dirTeacher?'儲存修改':'加入教師'}</button>${dirTeacher?`<button class="btn danger" type="button" data-act="deleteTeacher">移除教師</button>`:''}</div></form>`}`)
}
function newForm(){
  const teachers=directory?.teachers||[],classes=classNames();
  shell('<h1>安排抽查行動</h1><form id="createForm" class="card"><div class="fieldrow"><label>行動名稱<input name="title" required value="'+esc(form.title)+'"></label><label>日期<input name="date" type="date" required value="'+esc(form.date)+'"></label><label>時間<input name="time" type="time" required value="'+esc(form.time)+'"></label><label>年級<select name="grade" required><option value="">選擇年級</option>'+['四','五','六'].map(x=>'<option value="'+x+'年級" '+(form.grade===x+'年級'?'selected':'')+'>'+x+'年級</option>').join('')+'</select></label></div><label>統籌人<select name="coordinatorName" required><option value="">選擇統籌人</option>'+teachers.map(t=>'<option value="'+esc(t.name)+'" '+(form.coordinatorName===t.name?'selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select></label><div class="row between" style="margin-top:16px"><h2>班別與負責老師</h2><div class="row"><button type="button" class="btn secondary sm" data-act="loadGrade">帶入全級</button><button type="button" class="btn secondary sm" data-act="addClass">＋ 班別</button></div></div><p class="small muted">由私人學生名單帶入各班；管理者建立行動後，進入行動隨機抽籤。</p>'+drafts.map((d,i)=>'<section class="class-editor" data-draft="'+esc(d.id)+'"><div class="row between"><h3>第 '+(i+1)+' 班</h3><button type="button" class="btn danger sm" data-act="removeClass" data-id="'+esc(d.id)+'">移除</button></div><div class="fieldrow"><label>班別<select data-field="label" required><option value="">選擇班別</option>'+classes.map(c=>'<option value="'+esc(c)+'" '+(d.label===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></label><label>負責老師<select data-field="teacherName" required><option value="">選擇老師</option>'+teachers.map(t=>'<option value="'+esc(t.name)+'" '+(d.teacherName===t.name?'selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select></label><label>抽查人數<input data-field="sampleCount" type="number" min="1" max="60" required value="'+esc(d.sampleCount)+'"></label></div></section>').join('')+'<button class="btn" type="submit">建立行動</button></form>')
}

function assignBox(c,a){let roster=Object.fromEntries(c.roster.map(s=>[s.id,(s.number?s.number+' ':'')+s.name])),checked=c.selected.filter(id=>c.records[id]?.result).length,edit=!state.admin&&a.status==='active'&&c.teacherName===teacherName;return '<section class="card active"><div class="row between"><div><h2>'+esc(c.label)+'</h2><span class="small muted">'+checked+'/'+c.sampleCount+' 人已處理 · '+esc(c.teacherName)+'</span></div><span class="pill '+(checked===c.sampleCount&&c.selected.length?'done':'')+'">'+(checked===c.sampleCount&&c.selected.length?'本班完成':'處理中')+'</span></div>'+(c.selected.length?c.selected.map((id,i)=>studentBox(c,id,roster[id],i,edit)).join(''):state.admin&&a.status==='active'?'<p class="small muted">由管理者隨機抽選 '+c.sampleCount+' 位學生。</p><button class="btn" data-act="draw" data-class="'+esc(c.classId)+'">隨機抽籤</button>':'<p class="notice">等候管理者抽籤</p>')+(c.replacementLog.length?'<details><summary class="small">缺席重抽記錄（'+c.replacementLog.length+'）</summary><ul class="small">'+c.replacementLog.map(x=>'<li>'+esc(x.at)+'：'+esc(x.outName)+' → '+esc(x.inName)+'</li>').join('')+'</ul></details>':'')+'</section>'}

function studentBox(c,id,name,i,edit){
  const r=c.records[id]||{},prefix=esc(c.classId)+'-'+esc(id),absent=r.result==='absent';
  const label=r.result==='ok'?'沒有問題':r.result==='issue'?'有問題':absent?'缺席（不重抽）':'待檢查';
  const statusClass=r.result==='ok'?'done':r.result==='issue'||absent?'warn':'';
  return `<div class="student" data-record-class="${esc(c.classId)}" data-student="${esc(id)}">
    <div class="student-head"><span class="student-name">${i+1}. ${esc(name)}</span><span class="pill ${statusClass}">${label}</span></div>
    ${edit?`<div class="choices"><label class="choice"><input type="radio" name="result-${prefix}" value="ok" ${r.result==='ok'?'checked':''}>沒有問題</label><label class="choice"><input type="radio" name="result-${prefix}" value="issue" ${r.result==='issue'?'checked':''}>有問題</label></div>
      <div class="choices issues ${r.result==='issue'?'':'hidden'}">${issues.map((x,j)=>`<label class="choice"><input type="checkbox" value="${j}" ${(r.issues||[]).includes(x)?'checked':''}>${esc(x)}</label>`).join('')}</div>
      <label>檢查備註<textarea data-part="remarks" rows="2" placeholder="可留空">${esc(r.remarks||'')}</textarea></label>
      <label class="choice"><input type="checkbox" data-part="follow" ${r.followUp?'checked':''}>需要跟進</label>
      <div class="fieldrow follow-fields ${r.followUp?'':'hidden'}"><label>跟進日期<input type="date" data-part="followDate" value="${esc(r.followDate||'')}"></label><label>跟進備註<textarea data-part="followNotes" rows="2">${esc(r.followNotes||'')}</textarea></label></div>
      <div class="row between" style="margin-top:9px"><div class="row">${!r.result? `<button class="btn ghost sm" data-act="replace" data-class="${esc(c.classId)}" data-student="${esc(id)}">缺席重抽</button><button class="btn ghost sm" data-act="absent" data-class="${esc(c.classId)}" data-student="${esc(id)}">缺席不重抽</button>`:''}</div><button class="btn sm" data-act="save" data-class="${esc(c.classId)}" data-student="${esc(id)}">儲存</button></div>
      ${absent?'<p class="small muted">已記錄缺席；如學生其後接受檢查，可選擇結果再儲存。</p>':''}`
      :`<p class="small">${label}${r.result==='issue'?'：'+esc((r.issues||[]).join('、')):''}${r.remarks?' · '+esc(r.remarks):''}${r.followUp?' · 需跟進 '+esc(r.followDate)+' '+esc(r.followNotes):''}</p>`}
  </div>`;
}
function detail(){
  const a=current.action,p=a.progress||{},done=Object.values(p).filter(x=>x.done).length;
  shell(`<div class="row between"><div><h1>${esc(a.title)}</h1><div class="small muted">${esc(a.date)} ${esc(a.time)} · ${esc(a.grade)} · 統籌：${esc(a.coordinatorName)}</div></div><span class="pill ${a.status==='completed'?'done':''}">${a.status==='completed'?'已完成':'進行中'}</span></div>
    <section class="card"><div class="row between"><strong>全組進度 ${done}/${a.classes.length} 班</strong>${(state.admin||current.canLead)?`<button class="btn ghost sm" data-act="report">整體報告</button>`:''}</div>
      <div class="progress"><i style="width:${a.classes.length?done/a.classes.length*100:0}%"></i></div>
      ${a.classes.map(c=>{let q=p[c.id]||{};return `<div class="assign"><span>${esc(c.label)} · ${esc(c.teacherName)}</span><span class="pill ${q.done?'done':q.checked?'warn':''}">${q.done?'已完成':`${q.checked||0}/${q.total||0}`}</span></div>`}).join('')}
    </section>
    ${current.assignments.map(c=>assignBox(c,a)).join('')}
    ${state.admin?`<div class="card"><div class="row between"><strong>任務管理</strong><div class="row"><button class="btn ${a.status==='completed'?'secondary':'danger'} sm" data-act="status">${a.status==='completed'?'重新開啟':'完成整體行動'}</button><button class="btn danger sm" data-act="deleteAction" data-id="${esc(a.id)}">刪除任務</button></div></div></div>`:''}`);
  if(current.priorFollowUps?.length){
    const rows=current.priorFollowUps.map(x=>`<li><strong>${esc(x.classLabel)} ${esc(x.number?x.number+' ':'')}${esc(x.name)}</strong> · ${esc(x.previousActionTitle)}（${esc(x.previousActionDate)}）<br>跟進日期：${esc(x.followDate)} · ${esc(x.followNotes)}</li>`).join('');
    app.querySelector('main.shell').insertAdjacentHTML('beforeend',
      `<section class="card prior-followups"><h2>上次任務需跟進</h2><ul>${rows}</ul></section>`);
  }
}
function report(){let a=current.action,rows=current.assignments.flatMap(c=>{let roster=Object.fromEntries(c.roster.map(x=>[x.id,x.name]));return c.selected.map(id=>({label:c.label,teacher:c.teacherName,name:roster[id],r:c.records[id]||{}}))}),problems=rows.filter(x=>x.r.result==='issue').length,absent=rows.filter(x=>x.r.result==='absent').length,follow=rows.filter(x=>x.r.followUp).length;shell(`<div class="row between no-print"><button class="btn ghost sm" data-act="back">← 返回</button><button class="btn" data-act="print">列印／另存 PDF</button></div><article class="card report"><h1>BYOD iPad 抽查報告</h1><div class="report-meta"><span>${esc(a.date)} ${esc(a.time)} · ${esc(a.grade)}</span><span>統籌：${esc(a.coordinatorName)}</span><span>${a.classes.length} 班 · 抽查 ${rows.length} 人</span><span>有問題 ${problems} 人 · 缺席 ${absent} 人 · 需跟進 ${follow} 人</span></div><table><thead><tr><th>班別</th><th>學生</th><th>負責老師</th><th>結果／問題</th><th>檢查備註</th><th>跟進日期／備註</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.label)}</td><td>${esc(x.name)}</td><td>${esc(x.teacher)}</td><td>${x.r.result==='ok'?'沒有問題':x.r.result==='issue'?'有問題：'+esc(x.r.issues.join('、')):x.r.result==='absent'?'缺席（不重抽）':'待檢查'}</td><td>${esc(x.r.remarks||'—')}</td><td>${x.r.followUp?esc(x.r.followDate+' '+x.r.followNotes):'—'}</td></tr>`).join('')}</tbody></table><p class="small">缺席重抽：${esc(current.assignments.flatMap(c=>c.replacementLog.map(x=>`${c.label} ${x.outName} → ${x.inName}（${x.at}）`)).join('；')||'無')}</p><p class="small muted">備註較長時可能超過一頁。</p></article>`)}
function acceptState(next){state=next;teacherName=next.teacherName||'';directory=next.directory||directory;render()}
function applyActionUpdate(data,type){
  if(data?.action&&Array.isArray(data.assignments)){current=data;return}
  const c=current?.assignments.find(x=>x.classId===data?.classId);
  if(!c)throw new Error('資料已更新，請重新開啟任務。');
  if(type==='draw'){
    if(!Array.isArray(data.selected))throw new Error('抽籤資料未能更新。');
    c.selected=data.selected;
  }else if(type==='replace'){
    if(!Array.isArray(data.selected)||!Array.isArray(data.replacementLog))throw new Error('重抽資料未能更新。');
    c.selected=data.selected;c.replacementLog=data.replacementLog;
  }else if(type==='save'){
    if(!data.studentId||!data.record)throw new Error('抽查紀錄未能更新。');
    c.records[data.studentId]=data.record;
  }
  const checked=c.selected.filter(id=>c.records[id]?.result).length;
  const progress={total:c.sampleCount,checked,done:c.selected.length===c.sampleCount&&checked===c.sampleCount};
  current.action.progress[c.classId]=progress;
  const summary=state.actions.find(x=>x.id===current.action.id);
  if(summary)summary.progress[c.classId]=progress;
}
async function refreshDirectoryQuietly(){
  try{
    directory=await callQuiet('getDirectory');
    if(screen==='directory'&&!busy&&!document.activeElement?.matches('input,textarea,select'))render();
  }catch(error){console.warn('名單背景更新失敗',error)}
}
async function load(silent=false){if(!sessionStorage.getItem('byodToken')){loginPage();return}try{if(silent&&(busy||document.activeElement?.matches('input,textarea,select')))return;const detailId=screen==='detail'&&current?current.action.id:null,next=await (silent?callQuiet:call)('getAppState','',detailId);if(silent&&(busy||document.activeElement?.matches('input,textarea,select')))return;if(next.detail&&screen==='detail'&&current?.action.id===detailId)current=next.detail;acceptState(next)}catch(e){const message=e.message||String(e);if(/登入|密碼|帳戶/.test(message)){sessionStorage.removeItem('byodToken');loginPage(message)}else if(!silent)app.innerHTML='<main class="shell"><div class="card notice"><h1>暫時無法開啟</h1><p>'+esc(message)+'</p></div></main>'}}

app.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b||busy)return;let a=b.dataset.act;busy=true;b.disabled=true;try{switch(a){case 'logout':await call('logout');sessionStorage.removeItem('byodToken');current=null;directory=null;loginPage();break;case 'home':screen='home';render();break;case 'history':screen='history';render();break;case 'new':screen='new';render();break;case 'directory':screen='directory';render();break;case 'dirStudents':dirMode='students';render();break;case 'dirTeachers':dirMode='teachers';render();break;case 'deleteTeacher':{if(!confirm(`移除 ${dirTeacher}？已建立的行動不受影響。`))break;await call('removeTeacher',dirTeacher);directory.teachers=directory.teachers.filter(x=>x.name!==dirTeacher);dirTeacher='';render();refreshDirectoryQuietly();toast('教師已移除');break}case 'deleteAction':{const id=b.dataset.id||current?.action.id,selected=state.actions.find(x=>x.id===id)||current?.action;if(!state.admin||!selected)throw Error('只有管理者可以刪除任務。');if(!confirm(`確定刪除「${selected.title}」？任務及所有抽查紀錄將永久刪除。`))break;await call('deleteAction',id);state.actions=state.actions.filter(x=>x.id!==id);if(current?.action.id===id){current=null;screen='home'}render();toast('任務已刪除');break}case 'loadGrade':{syncForm();let grade={'四年級':'4','五年級':'5','六年級':'6'}[form.grade];if(!grade)throw Error('請先選擇年級。');drafts=classNames().filter(c=>c.startsWith(grade)).map(label=>{let d={id:uid(),label:'',teacherName:'',roster:'',sampleCount:5};fillClass(d,label);return d});if(!drafts.length)throw Error('這級未有學生名單。');render();break}case 'addClass':syncForm();drafts.push({id:uid(),label:'',teacherName:'',roster:'',sampleCount:5});render();break;case 'removeClass':syncForm();drafts=drafts.filter(x=>x.id!==b.dataset.id);render();break;case 'open':current=await call('getAction',b.dataset.id,teacherName);screen='detail';render();break;case 'draw':applyActionUpdate(await call('drawStudents',current.action.id,b.dataset.class,true),'draw');render();break;case 'replace':{let c=current.assignments.find(x=>x.classId===b.dataset.class),s=c.roster.find(x=>x.id===b.dataset.student);if(!confirm(`${s.name} 缺席？系統會隨機重抽並保留記錄。`))break;applyActionUpdate(await call('replaceAbsent',current.action.id,c.classId,s.id,teacherName,true),'replace');render();break}case 'absent':{let c=current.assignments.find(x=>x.classId===b.dataset.class),s=c?.roster.find(x=>x.id===b.dataset.student);if(!s)throw Error('找不到學生。');if(!confirm(`${s.name} 缺席，確定不重抽？`))break;applyActionUpdate(await call('saveResult',current.action.id,c.classId,s.id,{result:'absent'},teacherName,true),'save');render();toast('已記錄缺席，不會重抽');break}case 'save':{let el=b.closest('[data-record-class]'),result=el.querySelector('input[type=radio]:checked')?.value;if(!result)throw Error('請先選擇結果。');let v={result,issues:[...el.querySelectorAll('.issues input:checked')].map(x=>issues[Number(x.value)]),remarks:el.querySelector('[data-part=remarks]').value,followUp:el.querySelector('[data-part=follow]').checked,followDate:el.querySelector('[data-part=followDate]').value,followNotes:el.querySelector('[data-part=followNotes]').value};if(result==='issue'&&!v.issues.length)throw Error('請選擇問題類型。');if(v.followUp&&(!v.followDate||!v.followNotes.trim()))throw Error('請填妥跟進日期及備註。');applyActionUpdate(await call('saveResult',current.action.id,b.dataset.class,b.dataset.student,v,teacherName,true),'save');render();toast('已儲存');break}case 'report':current=await call('getAction',current.action.id,teacherName);screen='report';render();break;case 'back':screen='detail';render();break;case 'print':window.print();break;case 'status':{let next=current.action.status==='active'?'completed':'active';await call('setActionStatus',current.action.id,next,teacherName);current.action.status=next;let summary=state.actions.find(x=>x.id===current.action.id);if(summary)summary.status=next;render();toast('狀態已更新');break}}}catch(err){toast(err.message||String(err))}finally{busy=false;if(b.isConnected)b.disabled=false}});
app.addEventListener('change',e=>{if(e.target.id==='rosterClass'){dirClass=e.target.value;render();return}if(e.target.id==='teacherSelect'){dirTeacher=e.target.value;render();return}let draft=e.target.closest('[data-draft]');if(draft&&e.target.dataset.field==='label'){syncForm();let d=drafts.find(x=>x.id===draft.dataset.draft);fillClass(d,e.target.value);render();return}let el=e.target.closest('[data-record-class]');if(!el)return;el.querySelector('.issues').classList.toggle('hidden',el.querySelector('input[type=radio]:checked')?.value!=='issue');el.querySelector('.follow-fields').classList.toggle('hidden',!el.querySelector('[data-part=follow]').checked)});
app.addEventListener('submit',async e=>{if(e.target.id==='chooseTeacherForm'){e.preventDefault();if(busy)return;busy=true;try{acceptState(await call('selectTeacher',e.target.elements.name.value))}catch(err){toast(err.message||String(err))}finally{busy=false}return}if(e.target.id!=='loginForm')return;e.preventDefault();if(busy)return;busy=true;const f=e.target,b=f.querySelector('[type=submit]');b.disabled=true;try{const result=await call('login',f.elements.loginName.value,f.elements.password.value);sessionStorage.setItem('byodToken',result.token);f.reset();acceptState(result.app)}catch(err){loginPage(err.message||String(err))}finally{busy=false}});
app.addEventListener('submit',async e=>{
  if(!['rosterForm','teacherForm'].includes(e.target.id))return;
  e.preventDefault();if(busy)return;busy=true;
  const f=e.target,b=f.querySelector('[type=submit]');b.disabled=true;
  try{
    if(f.id==='rosterForm'){
      const students=rosterLines(f.elements.roster.value);
      const result=await call('saveClassRoster',dirClass,students);
      directory.students=directory.students.filter(x=>x.classLabel!==result.classLabel)
        .concat(students.map(x=>({classLabel:result.classLabel,...x})));
      render();refreshDirectoryQuietly();toast(`${result.classLabel} 名單已儲存（${result.count} 人）`);
    }else{
      const oldName=dirTeacher;
      const saved=await call('saveTeacher',{name:f.elements.name.value,defaultClass:f.elements.defaultClass.value},oldName);
      directory.teachers=directory.teachers.filter(x=>x.name!==oldName).concat(saved)
        .sort((a,b)=>a.name.localeCompare(b.name));
      dirTeacher=saved.name;render();refreshDirectoryQuietly();toast('教師資料已儲存');
    }
  }catch(err){toast(err.message||String(err))}finally{busy=false;if(b.isConnected)b.disabled=false}
});
app.addEventListener('submit',async e=>{if(e.target.id!=='createForm')return;e.preventDefault();if(busy)return;busy=true;let b=e.target.querySelector('[type=submit]');b.disabled=true;try{syncForm();const cls=drafts.map(d=>({label:d.label,teacherName:d.teacherName,sampleCount:Number(d.sampleCount)}));const created={...form,classes:cls},id=await call('createAction',created);
    const classes=cls.map((x,i)=>({id:'c'+(i+1),label:x.label,teacherName:x.teacherName}));
    const progress=Object.fromEntries(cls.map((x,i)=>['c'+(i+1),{total:x.sampleCount,checked:0,done:false}]));
    state.actions.unshift({id,title:created.title,date:created.date,time:created.time,grade:created.grade,
      coordinatorName:created.coordinatorName,status:'active',classes,progress,createdAt:new Date().toISOString()});
    state.actions.sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));
    form={title:'BYOD iPad 特擊抽查',date:today(),time:'',grade:'',coordinatorName:''};drafts=[{id:uid(),label:'',teacherName:'',roster:'',sampleCount:5}];screen='home';render();toast('行動已建立；請進入行動抽籤')}catch(err){toast(err.message||String(err))}finally{busy=false;b.disabled=false}});
load();setInterval(()=>{if(document.visibilityState==='visible'&&!busy&&screen!=='new'&&screen!=='directory'&&screen!=='report')load(true)},45000);
</script></body>
</html>
